<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <title>Community Donation Drive Tracker</title>
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <nav class="nav">
          <h1>Community Donation Drive Tracker</h1>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="summary">
        <div class="stat">
          <strong class="stat-met">0</strong><span>targets met</span>
        </div>
        <div class="stat">
          <strong class="stat-met">0</strong><span>items tracked</span>
        </div>
        <div class="stat">
          <strong class="stat-session-count">0</strong
          ><span>contributions this session</span>
        </div>
      </section>
      <div class="toolbar">
        <div class="field">
          <label for="search-input">Search Item</label>
          <input type="search" id="search-input" />
        </div>
        <div class="field">
          <label for="filter-status">Situation</label>
          <select id="filter-status">
            <option value="all">All</option>
            <option value="met">Met</option>
            <option value="needed">Needed</option>
          </select>
        </div>
      </div>

      <div class="workspace">
        <section class="main-panel">
          <h2>Donation Targets</h2>
          <div class="cards" id="cards-container">
          </div>
          <p id="cards-empty-state" class="empty-state hidden">
            No items match your search or filter.
          </p>
        </section>
        <div class="side-panel">
          <h2>Record a Contribution</h2>
          <div class="panel">
            <form action="#" class="form-row">
              <div class="field">
                <label for="donor-name">Donor Name:</label>
                <input
                  type="text"
                  id="donor-name"
                  placeholder="Donor, Enter your name"
                />
              </div>
              <div class="field">
                <label for="targets">Target:</label>
                <select name="" id="targets"></select>
              </div>
              <div class="field">
                <label for="quantity">Quantity:</label>
                <input
                  type="number"
                  id="quantity"
                  placeholder="Enter your quantity"
                />
              </div>
              <div class="action">
                <button type="submit">Save-form-datas</button>
              </div>
            </form>
            <div id="form-message" class="message hidden"></div>
          </div>
          <div class="panel">
            <h2>The list of the donor</h2>
            <div class="feild">
              <label for="donor-filter">Filter by donor name</label>
              <input
                type="search"
                id="donor-filter"
                placeholder="Fillter by donor name"
              />
            </div>
            <table class="table-wramp">
                <caption>Contributions recorded during this session</caption>
                <thead>
                  <tr>
                    <th scope="col">Donor</th>
                    <th scope="col">Item</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Action</th>
                  </tr>
                </thead>
                <tbody id="session-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
    <script src="app.js"></script>
  </body>
</html>
